name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find api lib -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Vercel Sandbox SDK surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Sandbox } from '@vercel/sandbox';

          const requiredStatic = ['get', 'getOrCreate'];
          const requiredPrototype = ['runCommand', 'currentSession', 'update', 'stop'];

          for (const key of requiredStatic) {
            if (typeof Sandbox[key] !== 'function') {
              throw new Error(`Sandbox.${key} is unavailable`);
            }
          }
          for (const key of requiredPrototype) {
            if (typeof Sandbox.prototype[key] !== 'function') {
              throw new Error(`Sandbox.prototype.${key} is unavailable`);
            }
          }

          console.log('Sandbox SDK surface: ok');
          NODE

      - name: Verify monitor-token authentication
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            HttpError,
            createMonitorCredential,
            requireMonitorToken,
          } from './lib/auth.js';

          const credential = createMonitorCredential();

          function sandboxFor(digest, expiresAt) {
            return {
              async runCommand() {
                return {
                  async stdout() {
                    return `${digest} ${expiresAt}\n`;
                  },
                };
              },
            };
          }

          const goodReq = {
            headers: { 'x-monitor-token': credential.token },
          };
          await requireMonitorToken(
            goodReq,
            sandboxFor(credential.digest, credential.expiresAt),
            '/fake/monitor-auth',
          );

          let rejectedWrong = false;
          try {
            await requireMonitorToken(
              { headers: { 'x-monitor-token': 'x'.repeat(43) } },
              sandboxFor(credential.digest, credential.expiresAt),
              '/fake/monitor-auth',
            );
          } catch (error) {
            rejectedWrong = error instanceof HttpError && error.status === 403;
          }
          if (!rejectedWrong) {
            throw new Error('wrong monitor token was not rejected');
          }

          let rejectedExpired = false;
          try {
            await requireMonitorToken(
              goodReq,
              sandboxFor(credential.digest, Date.now() - 1),
              '/fake/monitor-auth',
            );
          } catch (error) {
            rejectedExpired = error instanceof HttpError && error.status === 401;
          }
          if (!rejectedExpired) {
            throw new Error('expired monitor token was not rejected');
          }

          console.log('Monitor-token auth: ok');
          NODE
